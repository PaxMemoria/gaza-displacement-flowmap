<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="description" content="Displacement movements inside the Gaza Strip, January 2025 to November 2026, from IOM Needs and Population Monitoring data." />

  <title>Gaza Displacement Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      left: 0;
    }

    .panel {
      background: #fff;
      border-radius: 5px;
      padding: 8px 10px;
      direction: var(--dir, ltr);
      text-align: start;
      font-size: 13px;
      line-height: 1.6;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    .title h1 {
      font-size: 16px;
      margin: 0 0 2px;
    }

    .title p {
      margin: 0;
      max-width: 300px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 3px 0;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex: none;
    }

    .bar {
      width: 50px;
      flex: none;
    }

    .swatch {
      width: 18px;
      height: 12px;
      flex: none;
    }

    .source {
      font-size: 11px;
      color: #555;
      margin-top: 6px;
      max-width: 260px;
    }

    .phases {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 8px;
    }

    .phases button {
      font: inherit;
      font-size: 12px;
      text-align: start;
      direction: var(--dir, ltr);
      background: #f4f4f4;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
    }

    .phases button.active {
      background: #d22630;
      border-color: #d22630;
      color: #fff;
    }

    .phase-note {
      margin-top: 6px;
      font-size: 12px;
      color: #333;
      max-width: 300px;
    }

    .leaflet-tooltip.gov-label {
      background: transparent;
      border: none;
      box-shadow: none;
      color: #444;
      font-weight: bold;
      text-shadow: 0 0 3px #fff, 0 0 3px #fff;
    }

    .leaflet-tooltip {
      direction: var(--dir, ltr);
      text-align: start;
    }
  </style>

</head>

<body>

  <div id="map"></div>

  <!-- first load LeafletJS -->
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

  <!-- load Esri Leaflet because we want to use an Esri basemap -->
  <script src="https://unpkg.com/esri-leaflet@3.0.0/dist/esri-leaflet.js"></script>

  <!-- load animation tweening lib requirement for CanvasFlowMapLayer -->
  <script src="https://unpkg.com/@tweenjs/tween.js@18.6.4/dist/tween.umd.js"></script>

  <!-- then load CanvasFlowMapLayer -->
  <script src="./src/CanvasFlowmapLayer.js"></script>

  <!-- CSV parsing -->
  <script src="https://unpkg.com/papaparse@5.3.0/papaparse.min.js"></script>

  <script src="./src/app.js"></script>

</body>

</html>
